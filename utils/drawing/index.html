    <script src="https://kmu.pisc.cc/script.js"></script>
    <script>
        const connectorSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        function create() {
            connectorSvg.id = 'connectorSvg';
            connectorSvg.setAttribute('style', "position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;");
            document.querySelector('#editor').appendChild(connectorSvg);
            return connectorSvg;
        };
        function connectElementsWithCurve(elem1, elem2, svgContainer) {
            const rect1 = elem1.getBoundingClientRect();
            const rect2 = elem2.getBoundingClientRect();

            // Calculate start and end points
            const startX = rect1.right;
            const startY = rect1.top + rect1.height / 2;
            const endX = rect2.left;
            const endY = rect2.top + rect2.height / 2;

            // Define control points for a cubic Bezier curve
            // Adjust these values to change the curve's shape
            const controlPoint1X = startX + 50;
            const controlPoint1Y = startY;
            const controlPoint2X = endX - 50;
            const controlPoint2Y = endY;

            const pathData = `M ${startX} ${startY} C ${controlPoint1X} ${controlPoint1Y}, ${controlPoint2X} ${controlPoint2Y}, ${endX} ${endY}`;

            let path = svgContainer.querySelector('path');
            if (!path) {
                path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                svgContainer.appendChild(path);
            }

            path.setAttribute("d", pathData);
            path.setAttribute("stroke", window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "white" : "black");
            path.setAttribute("stroke-width", "2");
            path.setAttribute("fill", "transparent");
        };
        function connect(e1, e2) {
            // const connectorSvg1 = document.getElementById('connectorSvg');
            // connectElementsWithCurve(element1, element2, connectorSvg1);
            // setInterval(() => {
            //     connectElementsWithCurve(element1, element2, connectorSvg1);
            // }, 200);

            const connectorSvg = create();
            connectElementsWithCurve(e1, e2, connectorSvg);
            setInterval(() => {
                connectElementsWithCurve(e1, e2, connectorSvg);
            });

            // Initial connection
            // connectElementsWithCurve(element1, element2, connectorSvg);
            // setInterval(() => {
            //     connectElementsWithCurve(element1, element2, connectorSvg);
            // });
            // Adjusting the curve (e.g., on element drag or resize)
            // You would re-call connectElementsWithCurve whenever element positions change.
            // Example:
            // element1.addEventListener('mouseup', () => connectElementsWithCurve(element1, element2, connectorSvg));
            // element2.addEventListener('mouseup', () => connectElementsWithCurve(element1, element2, connectorSvg));
        };
        function s(e1, e2) {
            connect(document.getElementById(e1), document.getElementById(e2));
        };
        s("e1", "e3");
        s("e4", "e3");
        s("e3", "e2");
        s("e4", "e5");
        s("e1", "e2");
        s("e3", "e5");
        s("e1", "e4");
        s("e4", "e5");
        s("e1", "e2");
        s("e2", "e5");
    </script>
    <script>
        // Make the DIV element draggable:
        console.log("drag");
        // dragElement(document.getElementById("e1"));
        // dragElement(document.getElementById("e2"));
        document.querySelectorAll('.drag').forEach(dragElement);

        function dragElement(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            if (document.getElementById(elmnt.id + "header")) {
                // if present, the header is where you move the DIV from:
                document.getElementById(elmnt.id + "header").onmousedown = dragMouseDown;
            } else {
                // otherwise, move the DIV from anywhere inside the DIV:
                elmnt.onmousedown = dragMouseDown;
            }

            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                // get the mouse cursor position at startup:
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                // call a function whenever the cursor moves:
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                // calculate the new cursor position:
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY + 16;
                pos3 = e.clientX;
                pos4 = e.clientY;
                // set the element's new position:
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                let multiplier = 125;
                let ptop = (elmnt.offsetTop - pos2);
                let pleft = (elmnt.offsetLeft - pos1);
                ptop = Math.round(ptop / multiplier) * multiplier;
                pleft = Math.round(pleft / multiplier) * multiplier;
                elmnt.style.top = ptop + "px";
                elmnt.style.left = pleft + "px";
                // stop moving when mouse button is released:
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }
        console.log("drag");
    </script>
