    <div id="react-flow-container"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@xyflow/react/dist/reactflow.js"></script>

    <script type="text/babel">
        const { ReactFlow, useNodeState, useEdgesState, Controls, Background } = ReactFlow;

        const initialNodes = [
            { id: '1', data: { label: 'A' }, position: { x: 0, y: 0 } },
            { id: '2', data: { label: 'B' }, position: { x: 0, y: 100 } },
            { id: '3', data: { label: 'C' }, position: { x: 0, y: 200 } },
            { id: '4', data: { label: 'D' }, position: { x: 0, y: 300 } },
        ];

        const initialEdges = [
            { id: 'e1-2', source: '1', target: '2' },
            { id: 'e2-3', source: '2', target: '3' },
            { id: 'e3-4', source: '3', target: '4' },
        ];

        function FlowComponent() {
            const [nodes, setNodes, onNodesChange] = useNodesState(initialNodes);
            const [edges, setEdges, onEdgesChange] = useEdgesState(initialEdges);

            return (
                <ReactFlow
                    nodes={nodes}
                    edges={edges}
                    onNodesChange={setNodes}
                    onEdgesChange={setEdges}
                >
                    <Controls />
                    <Background variant="dots" gap={12} size={1} />
                </ReactFlow>
            );
        }

        const container = document.getElementById('react-flow-container');
        const root = ReactDOM.createRoot(container);
        root.render(<FlowComponent />);
    </script>

    <script src="../../script.js"></script>
