    <script>
const MAPPING = {
    "#iii#": ["3", "iii"],
    "#ii#": ["2", "ii"],
    "#iv#": ["4", "iv"],
    "#vi#": ["6", "vi"],
    "#v#": ["5", "v"],
    "#i#": ["1", "i"],
    "mathematics": ["math(s)?", "mathe?"],
    "mechanics": ["phys(ics?)?", "mech(anics?)?"],
    "chemistry": "chem(istry)?",
    "computer": "comp?(ut)?e?r?",
    "engi": "engi(ne?e?r)?i?n?g?",
    "engl": "engl?(ish)?",
    "introduction to": "intro(duct)?(ion)?s?",
    "fundamental": "fund(amental)?",
    "systems": "sys(tem)?s?",
    "materials": "mate?r(ial)?s?",
    "communicative": "comm",
    "programming": "prog(ramm?)?i?n?g?",
    "circuit": "circ(uit)?s?",
    "computer-aided design": "cad",
    "computer-aided manufacturing": "cam",
    "electri": "electric?(a?l?|c?i?t?y?)?s?",
    "electro": "electron?i?c?s?",
    "phenomena": "pheno?m?e?n?a?",
    "drawing": "draw?i?n?g?"
};

const FLAT_MAPPING = [];
for (const [target, src] of Object.entries(MAPPING)) {
    const sources = Array.isArray(src) ? src : [src];
    for (const p of sources) {
        FLAT_MAPPING.push({ pattern: p, target });
    }
}

const MASTER_REGEX = new RegExp(
    FLAT_MAPPING.map(({ pattern }) => `(\\b(?:${pattern})\\b)`).join("|"),
    "gi"
);

// 2. High-performance function to run per CSV line
function formatAndStandardizeQuery(query) {
    let text = query.replace(MASTER_REGEX, (...args) => {
        for (let i = 0; i < FLAT_MAPPING.length; i++) {
            if (args[i + 1] !== undefined) {
                return FLAT_MAPPING[i].target;
            }
        }
        return args[0];
    });

    return text.toLowerCase().trim()
        .replace(/^"|".{0,2}$|^\,|,\s*,?/g, '')
        .replace(/[\s,\^\"\'\-_]/g, '')
        .replace(/s/g, '')
        .replace(/#+/g, '#');
}

async function fetchAndParseCSV() {
    try {
        const response = await fetch('files.csv');
        
        if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const csvData = await response.text();

        // Split by newline and map each non-empty row to its comma-separated columns
        const rows = csvData
            .split('\n')
            .filter(row => row.trim() !== '') // Remove empty trailing lines
            .map(row => row.split(',').map(a => a.trim()))
            .slice(1);

        return rows;

    } catch (error) {
        console.error('Error fetching the CSV file:', error);
        return []; // Return an empty array in case of an error
    }
}

// fetchAndParseCSV();

function createRow(name, { year, term, period, ep = null, path } = {}) {
    const tr = document.createElement('tr');
    tr.classList.add('bg-neutral-600', 'dark:bg-neutral-900', 'hover:bg-gray-100/30', 'hover:dark:bg-gray-800/30', 'border-x', 'border', 'border-gray-300', 'dark:border-gray-700', 'text-gray-900', 'dark:text-white')

    const thName = document.createElement('th');
    thName.classList.add('py-3');
    thName.textContent = name;
    tr.appendChild(thName);

    const thYear = document.createElement('th');
    thYear.classList.add('py-3');
    thYear.textContent = year;
    tr.appendChild(thYear);
    

    let fullPeriod = ""
    if (period[0].toLowerCase() == "m") {
        fullPeriod = "Midterm"
    } else if (period[0].toLowerCase() == "f") {
        fullPeriod = "Final"
    } else {
        fullPeriod = ""
    }
    const thTermPeriod = document.createElement('th');
    thTermPeriod.classList.add('py-3');
    thTermPeriod.textContent = `Term ${term} ${fullPeriod}`;
    tr.appendChild(thTermPeriod);

    const thEP = document.createElement('th');
    thEP.classList.add('py-3');
    thEP.textContent = ep;
    tr.appendChild(thEP);

    const thDownload = document.createElement('th');
    thDownload.classList.add('px-3', 'py-3');
    // <span class="material-symbols-outlined">download</span></th>
    const a = document.createElement('a');
    // a.href = `files/${name}.pdf`;
    a.href = `https://api.kmu.pisc.cc/download/old-exam/raw/${path}`;
    a.classList.add('material-symbols-outlined');
    a.textContent = "download";
    a.target = "_blank";
    thDownload.appendChild(a);
    tr.appendChild(thDownload);

    return tr
}

//     elif re.search(r"^(?!.*ep)(?!.*?\bs\d+\b).*$", str(file_path), re.IGNORECASE):
//         return 2 # Not Sure
//     return 0 # Not EP
// ```

function fileIsEP(fpath) {
    "0: Not EP, 1: EP, 2: Not sure"
    if (fpath.toLowerCase().includes("ep")) {
        return 1
    } else if (/^(?=.*ep|.*?\bS(?!1\b)\d+\b)/i.test(fpath)) {
        return 1
    } else if (/^(?!.*ep)(?!.*?\bs\d+\b).*$/i.test(fpath)) {
        return 2
    } else {
        return 0
    }   
}

const search = document.querySelector("#search")
const clearText = document.getElementById('clear-text')
clearText.addEventListener('click', () => {
    search.value = "";
})

const tableBody = document.querySelector("#table-body");
tableBody.replaceChildren();
// (await fetchAndParseCSV()).map(f => f[0].split(',').map(a=>a.trim()))

// Pre-compile dataset once on initialization
const dataPromise = fetchAndParseCSV().then(rows => 
    rows.map(row => {
        const [year, term, period] = [row[1], row[2], row[3]];
        const ep = fileIsEP(row[6].replaceAll(/\\+/g, "\\").replaceAll(/["']/g, ""));
        const name = row[5] ? /[^'"|]+/.exec(row[5])[0] : row[4];

        return {
            name,
            meta: {
                year,
                term,
                period,
                ep: ["Not EP", "EP", "-"][ep],
                path: row[6].replaceAll(/[\\\/]+/g, "/").replaceAll(/["']/g, "")
            },
            // Pre-compile search target string
            searchTarget: formatAndStandardizeQuery(row.join(","))
        };
    })
);

// Search listener uses pre-compiled dataset
// document.querySelector("#search").addEventListener("input", async e => {
search.addEventListener("input", async e => {
    const queryFormatted = formatAndStandardizeQuery(e.target.value);
    const dataset = await dataPromise;

    tableBody.innerHTML = ""; // Clear previous results

    if (!queryFormatted) return;

    const matchedRows = dataset
        .filter(item => item.searchTarget.includes(queryFormatted))
        .slice(0, 100)
        .map(item => createRow(item.name, item.meta));

    tableBody.append(...matchedRows);
});
