    <script>
        function isIOS() {
            const userAgent = navigator.userAgent;
            const platform = navigator.platform;

            // Check for common iOS user agent strings
            if (/iPad|iPhone|iPod/.test(userAgent)) {
                return true;
            }

            // Specific check for iPad on iOS 13+ which might report as 'MacIntel' platform
            if (platform === 'MacIntel' && navigator.maxTouchPoints > 1) {
                return true;
            }

            return false;
        };

        function openFile(path) {
            // if (isIOS()) {
            //     window.open(path, '_blank');
            // } else {
                const FrameElement = document.getElementById("FileFrame");
                FrameElement.src = "https://docs.google.com/viewerng/viewer?embedded=true&url=raw.githubusercontent.com/pisc639-kmu/kmutnb/main/old-exam/1-2-m/" + path;
                FrameElement.setAttribute("raw", "https://raw.githubusercontent.com/pisc639-kmu/kmutnb/main/old-exam/1-2-m/" + path);
                if (FrameElement.classList.contains("hidden")){
                    FrameElement.classList.remove("hidden");
                }
                if (FrameElement.classList.contains("md:hidden")){
                    FrameElement.classList.remove("md:hidden");
                }
                window.location.href = "#FileFrame";
            // };

            const IFrameTitle = document.getElementById("iframe-title");
            IFrameTitle.textContent = path;

            const iframeContainer = document.getElementById('iframe-container');
            if (iframeContainer.classList.contains('display-none')) {
                iframeContainer.classList.remove('display-none');
            }
        };
    </script>

    <script>
        function download_file() {
            const FileFrame = document.getElementById('FileFrame');
            var url = FileFrame.getAttribute('raw');
            var a = document.createElement('a');
            a.href = url;
            a.download = url;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    </script>

    <script>
    window.addEventListener('scroll', function(event) {
        const navHeight = document.querySelector('nav').offsetHeight;
        const iframe = document.getElementById('FileFrame');
        const iframeContainer = document.getElementById('iframe-container');
        const rect = iframe.getBoundingClientRect();
        if (rect.top <= window.innerHeight - navHeight && rect.bottom >= 0) {
            iframe.style.height = `calc(100vh - ${navHeight}px)`;
            iframe.style.width = '100%';
            iframe.classList.remove('hidden');
        } else {
            iframe.style.height = '';
            iframe.style.width = '';
            iframe.classList.add('hidden');
        }
    });
    </script>
    <script>
        // fetch("https://api.github.com/repos/pisc639-kmu/kmutnb/contents/old-exam/1-1-f").then(a => a.json()).then(a => console.log(a))
        const SubjectsFull = [
            "Mathematics II",
            "Thai II",
            "Chemistry II",
            "Foundation English II",
            "Mechanics II",
            "Mechanical Drawing I",
            "Electrical Measuring Instruments",
            "Electric Circuits II"
        ];
        const Subjects = [
            "Math",
            "Thai",
            "Chemistry",
            "English",
            "Physics",
            "Drawing",
            "EMI",
            "Circuit"
        ];
        const tbody = document.getElementById("table-body");
        for (let i = 0; i < SubjectsFull.length; i++) {
            const row = document.createElement("tr");
            row.classList.add("bg-white", "dark:bg-gray-800", "hover:bg-gray-100", "dark:hover:bg-gray-700", "border-x", "border", "border-gray-300", "dark:border-gray-700", "text-gray-900", "dark:text-white");
            const subjectName = document.createElement("th");
            subjectName.classList.add("px-5", "py-3");
            subjectName.textContent = SubjectsFull[i];
            row.appendChild(subjectName);
            for (let j = 2011; j <= 2025; j++) {
                const column = document.createElement("th");
                column.classList.add("px-5", "py-3");
                row.appendChild(column);
            };
            tbody.appendChild(row);
        };
        function addFileButton(row, column, file, name) {
            console.log(row, column, file, name);
            var tbody = document.getElementById("table-body");
            var rowElement = tbody.children[row];
            var columnElement = rowElement.children[column + 1];
            var button = document.createElement("button");
            button.type = "button";
            button.classList.add("text-blue-600", "dark:text-blue-400", "hover:underline");
            // button.href = file;
            button.onclick = function() {
                openFile(file);
            };
            button.textContent = name;
            columnElement.appendChild(button);
        };
        function addFile(file) {
            var name = file.split(",")[0];
            var year = parseInt(name.split(" ")[1], 10);
            var subject = name.split(" ")[0];
            var row = parseInt(Subjects.indexOf(subject), 10);
            var column = year - 2011;
            addFileButton(row, column, file, name);
        };
        fetch("https://api.github.com/repos/pisc639-kmu/kmutnb/contents/old-exam/1-2-f").then(a => a.json()).then(files => {
            files.forEach(file => {
                if (file.name != "index.html") {
                    addFile(file.name);
                };
            });
        });
    </script>
