<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E15 Class Schedule</title>
    <link rel="icon" type="image/png" href="https://kmu.pisc.cc/img/logo-nobg.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://kmu.pisc.cc/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" integrity="sha384-5TcZemv2l/9On385z///+d7MSYlvIEw9FuZTIdZ14vJLqWphw7e7ZPuOiCHJcFCP" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" integrity="sha384-cMkvdD8LoxVzGF/RPUKAcvmm49FQ0oxwDF3BGKtDXcEc+T1b2N+teh/OJfpU0jr6" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh" crossorigin="anonymous" onload="renderMathInElement(document.body);"></script>
</head>
<body class="dark bg-gray-100 dark:bg-gray-900">
    <div class="flex items-center justify-center space-x-4 mt-16">
        <h1 class="text-4xl font-bold mb-4 text-gray-800 dark:text-white">Chat</h1>
    </div>
    <div class="flex flex-col h-screen justify-center items-center">
        <div id="message-container" class="flex flex-col space-y-4 p-4 overflow-y-auto h-auto">
            <div class="flex flex-col space-y-2">
                <div class="flex items-center">
                    <!-- <img src="https://example.com/avatar.jpg" alt="Avatar" class="w-8 h-8 rounded-full mr-2"> -->
                    <div class="bg-gray-200 dark:bg-gray-700 p-2 rounded-md">
                        <p class="text-gray-800 dark:text-white">Hello, how can I help you?</p>
                    </div>
                </div>
            </div>
        </div>
        <div>
            <form id="message-form" class="flex items-center justify-center space-x-4 mt-4 mx-auto">
                <input type="text" id="message-input" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-blue-500 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white" placeholder="Type your message..." autofocus>
                <button type="submit" id="send-button" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md focus:outline-none focus:ring focus:ring-blue-500"></button>
            </form>
        </div>
    </div>

    <script src="https://src.kmu.pisc.cc/script.min.js"></script>
    <script src="../static/js/app.js"></script>
</body>
</html>
