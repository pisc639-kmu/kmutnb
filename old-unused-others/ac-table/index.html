<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E15 Class Schedule</title>
    <link rel="icon" type="image/png" href="https://kmu.pisc.cc/img/logo-nobg.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://kmu.pisc.cc/style.css">
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" integrity="sha384-5TcZemv2l/9On385z///+d7MSYlvIEw9FuZTIdZ14vJLqWphw7e7ZPuOiCHJcFCP" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" integrity="sha384-cMkvdD8LoxVzGF/RPUKAcvmm49FQ0oxwDF3BGKtDXcEc+T1b2N+teh/OJfpU0jr6" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh" crossorigin="anonymous"
        onload="renderMathInElement(document.body);"></script>
</head>
<body class="dark bg-gray-100 dark:bg-gray-900">
    <div class="mt-8 text-center my-8">
        <h2 class="text-2xl font-bold mb-4 text-gray-800 dark:text-white">Group 2 | 12:10 - 13:40</h2>
    </div>
    <div class="container mx-auto mt-8 overflow-x-auto shadow-md shadow-gray-400 dark:shadow-gray-800 hover:shadow-gray-500 dark:hover:shadow-gray-950">
        <table id="subject-table" class="w-full border-collapse border border-gray-300 dark:border-gray-700">
            <thead>
                <tr class="bg-gray-200 dark:bg-gray-800 text-gray-900 dark:text-white shadow-md">
                    <th class="px-5 py-3 border-x border border-gray-300 dark:border-gray-700" colspan="3">Board</th>
                </tr>
            </thead>
            <tbody>
                <tr class="bg-white dark:bg-gray-900 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-white">
                    <td class="px-5 py-3 border-x border border-gray-300 dark:border-gray-700">Sky</td>
                    <td class="px-5 py-3 border-x border border-gray-300 dark:border-gray-700">Giew</td>
                    <td class="px-5 py-3 border-x border border-gray-300 dark:border-gray-700">Thames</td>
                </tr>
                <tr class="bg-white dark:bg-gray-900 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-white">
                    <td class="px-5 py-3 border-x border border-gray-300 dark:border-gray-700">Ping</td>
                    <td class="px-5 py-3 border-x border border-gray-300 dark:border-gray-700">Khao</td>
                    <td class="px-5 py-3 border-x border border-gray-300 dark:border-gray-700">First</td>
                </tr>
                <tr class="bg-white dark:bg-gray-900 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-white">
                    <td class="px-5 py-3 border-x border border-gray-300 dark:border-gray-700">Captan</td>
                    <td class="px-5 py-3 border-x border border-gray-300 dark:border-gray-700">Eiffel</td>
                    <td class="px-5 py-3 border-x border border-gray-300 dark:border-gray-700">Nond</td>
                </tr>
                <tr class="bg-white dark:bg-gray-900 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-white">
                    <td class="px-5 py-3 border-x border border-gray-300 dark:border-gray-700">Wan</td>
                    <td class="px-5 py-3 border-x border border-gray-300 dark:border-gray-700">Tum</td>
                </tr>
                <tr class="bg-white dark:bg-gray-900 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-white">
                    <td class="px-5 py-3 border-x border border-gray-300 dark:border-gray-700">Time</td>
                    <td class="px-5 py-3 border-x border border-gray-300 dark:border-gray-700">Klao</td>
            </tbody>
        </table>
    </div>

    <script src="https://src.kmu.pisc.cc/script.min.js"></script>
</body>
</html>
