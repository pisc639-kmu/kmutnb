<script>
        (async () => {
            // https://api.github.com/repos/pisc639-kmu/kmutnb/contents/
            const root = "https://api.github.com/repos/pisc639-kmu/kmutnb/contents/storage";

            const urlParams = new URLSearchParams(window.location.search);
            const storagePath = urlParams.get("path") ?? "";
            urlParams.set("path", storagePath)

            async function getFolders(path) {
                const url = root + path;
                const response = await fetch(url);
                const jsonData = await response.json();
                const filteredData = Object.fromEntries(
                    Object.entries(jsonData).filter(([key, value]) => value.type == "dir")
                );
                console.log(filteredData);
                return filteredData;
            };

            async function getFiles(path) {
                const url = root + path;
                const response = await fetch(url);
                const jsonData = await response.json();
                const filteredData = Object.fromEntries(
                    Object.entries(jsonData).filter(([key, value]) => value.type == "file")
                );
                console.log(filteredData);
                return filteredData;
            };

            async function createFolderButton(name, parent) {
                const button = document.createElement("button");
                button.classList.add(
                    "bg-gray-100", "dark:bg-gray-900",
                    "border", "border-gray-500", "border-md", "rounded-md",
                    "w-full", "h-12",
                    "text-xl",
                    "flex", "items-center")
                parent.appendChild(button)

                // <span class="material-symbols-outlined" style="color:#e3e3e3; font-size:24px;">folder</span>
                const icon = document.createElement("span");
                icon.classList.add(
                    "material-symbols-outlined",
                    "m-3"
                )
                icon.style = "color:#e3e3e3; font-size:24px;"
                icon.innerHTML = "folder"
                button.append(icon)

                const text = document.createElement("span")
                text.textContent = name
                button.append(text)

                button.addEventListener("click", async (e, ev) => {
                    e.textContent
                })
            }

            const ICON_BASE =
            "https://fonts.gstatic.com/s/i/materialsymbolsoutlined";

            const EXTENSION_ICON_MAP = {
                pdf: "picture_as_pdf",
                doc: "description",
                docx: "description",
                txt: "article",
                zip: "folder_zip",
                rar: "folder_zip",
                png: "image",
                jpg: "image",
                jpeg: "image",
                gif: "image",
                mp4: "movie",
                mkv: "movie",
                mp3: "music_note",
                wav: "music_note",
                m3a: "music_note",
                m4a: "music_note",
                js: "code",
                html: "code",
                css: "code",
                py: "code",
                json: "data_object",
                csv: "data_object",
                dat: "data_object",
                default: "insert_drive_file",
            };

            function getIconName(file) {
                const extension = file.split(".").at(-1).toLowerCase();
                return EXTENSION_ICON_MAP[extension] ?? EXTENSION_ICON_MAP.default;
            }

            async function getIcon(ext) {
                const normalized = ext.toLowerCase().replace(".", "");
                // const iconName =
                //     EXTENSION_ICON_MAP[normalized] ?? EXTENSION_ICON_MAP.default;
                const iconName = getIconName(ext)

                const img = document.createElement("img");
                img.src = `${ICON_BASE}/${iconName}/default/24px.svg`;
                img.alt = `${normalized} file`;
                img.width = 24;
                img.height = 24;
                img.loading = "lazy";

                return img
            }

            async function createFileButton(name, parent) {
                const button = document.createElement("button");
                button.classList.add(
                    "bg-gray-100", "dark:bg-gray-900",
                    "border", "border-gray-500", "border-md", "rounded-md",
                    "w-full", "h-12",
                    "text-xl",
                    "flex", "items-center");
                    parent.appendChild(button);

                    // <span class="material-symbols-outlined" style="color:#e3e3e3; font-size:24px;">folder</span>
                const icon = document.createElement("span");
                icon.classList.add(
                    "material-symbols-outlined",
                    "m-3"
                )
                icon.style = "color:#e3e3e3; font-size:24px;";

                const extension = name.split(".").at(-1).toLowerCase();
                // const extension_icon = EXTENSION_ICON_MAP[extension];
                const extension_icon = getIconName(extension);
                // icon.innerHTML = "picture_as_pdf";
                icon.innerHTML = extension_icon;
                button.append(icon);
                // button.append(await getIcon(".pdf"));

                const text = document.createElement("span");
                text.textContent = name;
                button.append(text);
            }

















            const mainContainer = document.getElementById("main-container");

            const folders = await getFolders("old-exam");
            console.log(folders);

            for (const key in folders) {
                await createFolderButton(folders[key]["name"], mainContainer);
                console.log(`Created ${folders[key]["name"]}`)
            };
            console.log("done");

            const files = await getFiles("old-exam");
            console.log(files);

            // await createFileButton("pdf", mainContainer)
            for (const key in files) {
                await createFileButton(files[key]["name"], mainContainer);
                console.log(`Created ${files[key]["name"]}`)
            };
        })();
    </script>
