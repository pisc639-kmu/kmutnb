function fill13(idStr) {
    const digits = idStr.toString().replace(/\D/g, '').split('').slice(0, 12).map(Number);
    if (digits.length !== 12) {
        throw new Error("Input must contain at least 12 digits");
    }
    const total = digits.reduce((sum, digit, index) => sum + (digit * (13 - index)), 0);
    const digit13 = (11 - (total % 11)) % 10;
    return idStr.toString().replace(/\D/g, '').slice(0, 12) + digit13;
}

function getStudentId(year, field, classNum, idNum) {
    const fieldMapping = {M:1,E:2,C:3,CB:4};
    const offsetMapping = {
        69: {
            M: 6,
            E: 5,
            C: 4,
            CB: 2,
        },
        68: {
            M: 8,
            E: 5,
            C: 4,
        },
        67: {
            M: 8,
            E: 5,
            C: 4,
        }
    };
    let offset = 0;
    if (parseInt(classNum) >= offsetMapping[year][field.toUpperCase()]) {
        offset = 8 - offsetMapping[year][field.toUpperCase()];
    } else {
        offset = -1;
    };
    // offset = -1;
    const studentID = fill13(`${year}0310${fieldMapping[field.toUpperCase()]||0}11${parseInt(classNum)+offset}${String(idNum).padStart(2, '0')}`);

    // console.log(studentID);
    return (studentID);
}

async function getExamScheduleWithId(year, field, classNum, idNum) {
    const studentid = getStudentId(year, field, classNum, idNum);

    // const response = await fetch("https://vichakarn.cit.kmutnb.ac.th/show.php", {
    //     "headers": {
    //         "Content-Type": "application/x-www-form-urlencoded",
    //     },
    //     "body": `idstudent=${studentid}&submit=`,
    //     "method": "POST",
    // })
    const response = await fetch(`https://es.pisc639.workers.dev/${studentid}`)
        .then(a => a.text())
        .catch(e => {console.error(e); return ""});
    const htmlString = response;

    const doc = new DOMParser().parseFromString(htmlString, 'text/html');

    const rowRegex = /(?<=:\s+)([^\s]+).*?(?<=:\s+\s)(.*$)/gm

    const row1 = [...(doc.querySelector("h5.text-white:nth-child(1)")?.textContent || "").matchAll(rowRegex)][0] || [];
    const row2 = [...(doc.querySelector("h5.text-white:nth-child(3)")?.textContent || "").matchAll(rowRegex)][0] || [];
    const studentInfo = {
        id: row1[1] || "Unknown ID",
        name: row1[2] || "Unknown Name",
        department: row2[1] || "Unknown Department",
        field: row2[2] || "Unknown Field",
    }

    const table = doc.querySelector("table");
    const tbody = table.children[0];
    const rows = Array.from(tbody.children).slice(1);

    const schedule = [];

    for (let row of rows) {
        const cells = Array.from(row.children);
        const [subjectId, subjectName, section, date, time, room] = cells.map(cell => cell.textContent);
        schedule.push({
            subjectId: subjectId,
            subjectName: subjectName,
            section: section,
            date: date,
            time: time,
            room: room,
        });
    }

    const result = {
        params: {
            studentid: studentid,
            year: year,
            field: field,
            classNum: classNum,
            idNum: idNum,
        },
        studentInfo: studentInfo,
        schedule: schedule,
        result: {
            studentfound: !(!row1.length && !row2.length),
            schedulefound: /^\d+$/.test(schedule[0].subjectId),
        }
    }

    return result;
}

async function getExamSchedule(year, field, classNum) {
    async function getExamScheduleEach(year, field, classNum, idNum) {
        const result = await getExamScheduleWithId(year, field, classNum, idNum);
        if (result.result.studentfound && result.result.schedulefound) {
            return result.schedule;
        } else {
            throw new Error(`Student not found: ${year} ${field} ${classNum} ${idNum}`);
        }
    }
    console.log(getStudentId(year, field, classNum, 1));
    let results = await Promise.allSettled([
        getExamScheduleEach(year, field, classNum, 1),
        getExamScheduleEach(year, field, classNum, 2),
        getExamScheduleEach(year, field, classNum, 3),
        getExamScheduleEach(year, field, classNum, 4),
        getExamScheduleEach(year, field, classNum, 5),
    ]).catch(e => {return null;});
    results = results.filter(r => r.status === "fulfilled");
    results = results.map(r => r.value);
    results = [...new Map(results.flat().map(item => [item.subjectId, item])).values()];
    console.log(results);
    
    return results;
}

function getYearOffset() {
    // new Date(new Date() - 1000 * 60 * 60 * 24 * 30 * 5).getUTCFullYear() - 1956
    const current = new Date();
    current.setMonth(current.getUTCMonth() - 5);
    return current.getUTCFullYear() - 1956;
}

function roomToInfo(classRoom) {
    const field = classRoom.replace(/[0-9]/gi, "");
    const [level, ...room] = classRoom.match(/\d/g);

    const res = [
        getYearOffset() - level,
        field,
        room.join(''),
        // parseInt(room) >= 5,
        // false,
    ];
    console.log(res);
    return res;
}

function scrollToElementWhenReady(elementId) {
    const targetElement = document.getElementById(elementId);

    // Helper to safely trigger the smooth scroll
    const executeScroll = (el) => {
        if (document.visibilityState === 'visible') {
            el.scrollIntoView({ behavior: 'smooth' });
        }
    };

    // If element already exists in the DOM, scroll immediately
    if (targetElement) {
        executeScroll(targetElement);
        return;
    }

    // Otherwise, observe DOM changes until the element appears
    const observer = new MutationObserver((mutations, obs) => {
        const el = document.getElementById(elementId);
        if (el) {
            executeScroll(el);
            obs.disconnect(); // Stop observing once found to prevent memory leaks
        }
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true
    });
}

function make_cell(elem, content, options = {}) {
    const cell = document.createElement(elem);
    cell.classList.add("px-3", "py-2", "border-x", "border", "border-neutral-300", "dark:border-neutral-700");
    cell.innerHTML = content;
    cell.colSpan = options.colspan || 1;
    return cell;
}

    const exams_span = document.getElementById('exams');
    exams_span.classList.remove('hidden');

    const exam = document.getElementById('exam');
    exam.innerHTML = '';

    // ---- exam days come directly from JSON keys ----
    const exam_days = Object.keys(exam_data).filter(k => k !== 'ignore');

    // ---- collect exam times ----
    let exam_times = [];
    exam_days.forEach(day => {
        exam_data[day].forEach(e => {
            exam_times.push(Number(e.from), Number(e.to));
        });
    });

    // ---- unique + sort ----
    exam_times = [...new Set(exam_times)].sort((a, b) => a - b);

    // ---- derive contiguous slots (old layout compatible) ----
    const EXAM_SLOTS = [];
    for (let i = 0; i < exam_times.length - 1; i++) {
        EXAM_SLOTS.push({
            from: exam_times[i],
            to: exam_times[i + 1]
        });
    }

    // ---------- THEAD ----------
    const examthead = document.createElement('thead');
    const headTr = document.createElement('tr');
    headTr.classList.add(
        "bg-neutral-200",
        "dark:bg-neutral-800",
        "text-neutral-900",
        "dark:text-white",
        "shadow-md"
    );

    headTr.appendChild(make_cell('th', 'Day'));

    EXAM_SLOTS.forEach(s => {
        headTr.appendChild(
            make_cell('th', `${s.from}:00 - ${s.to}:00`)
        );
    });

    examthead.appendChild(headTr);
    exam.appendChild(examthead);

    // ---------- TBODY ----------
    const examtbody = document.createElement('tbody');

    exam_days.forEach(dayLabel => {
        const exams = exam_data[dayLabel];

        const tr = document.createElement('tr');
        tr.classList.add(
            "bg-white",
            "dark:bg-neutral-900",
            "hover:bg-neutral-100",
            "dark:hover:bg-neutral-800",
            "text-neutral-800",
            "dark:text-white",
            "md:text-base",
        );

        // Row header uses FULL JSON KEY
        tr.appendChild(make_cell('td', dayLabel));

        let slotIndex = 0;

        while (slotIndex < EXAM_SLOTS.length) {
            const slot = EXAM_SLOTS[slotIndex];

            const examItem = exams.find(e =>
                Number(e.from) <= slot.from &&
                Number(e.to) > slot.from
            );

            if (!examItem) {
                // tr.appendChild(make_cell('td', ''));
                tr.appendChild(create_empty_cell());
                slotIndex++;
                continue;
            }

            // calculate colspan
            let span = 0;
            while (
                slotIndex + span < EXAM_SLOTS.length &&
                Number(examItem.to) > EXAM_SLOTS[slotIndex + span].from
            ) {
                span++;
            }

            tr.appendChild(
                make_cell(
                    'td',
                    `${examItem['name-en']}<br>
                    <span class="text-md md:text-base font-bold">${examItem['room']}</span><br>
                    ${examItem['code']}`,
                    { colspan: span }
                )
            );

            slotIndex += span;
        }

        examtbody.appendChild(tr);
    });

    exam.appendChild(examtbody);
// })();
};
    </script>
