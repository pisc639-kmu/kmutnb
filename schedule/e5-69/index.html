<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E15 Class Schedule</title>
    {% include "head.html" %}
</head>
<body class="dark bg-gray-50 dark:bg-gray-950 min-h-screen">
    {% include "nav.html" %}
    <div class="flex items-center text-center justify-center space-x-4 mt-16">
        <h1 class="text-4xl font-bold my-4 text-gray-800 dark:text-white">Study Schedule</h1>
        <a onclick="download_image();" class="items-center space-x-2 text-black dark:text-white hover:text-blue-500 dark:hover:text-blue-400">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
        </a>
    </div>
    {% include "schedule.html" %}
    <div class="container mx-auto mt-8 overflow-x-auto shadow-md shadow-gray-400 dark:shadow-gray-800 hover:shadow-gray-500 dark:hover:shadow-gray-950">
        <table id="timetable" class="text-[0.6rem] [&_thead]:text-xs [&>*>tr>*:first-child]:text-sm
            md:text-[0.8rem] md:[&_thead]:text-sm md:[&>*>tr>*:first-child]:text-md
            [&>*>tr>*:first-child]:font-bold
            w-full border-collapse border border-gray-300 dark:border-gray-700">
        </table>
    </div>

    <span id="exams" class="hidden">
        <div class="flex items-center text-center justify-center space-x-4 mt-16">
            <h1 class="text-4xl font-bold my-4 text-gray-800 dark:text-white">Exam Schedule</h1>
        </div>
    
        <div class="container mx-auto mt-8 overflow-x-auto shadow-md shadow-gray-400 dark:shadow-gray-800 hover:shadow-gray-500 dark:hover:shadow-gray-950">
            <table id="exam" class="text-[0.6rem] [&_thead]:text-xs [&>*>tr>*:first-child]:text-sm
                md:text-[0.8rem] md:[&_thead]:text-sm md:[&>*>tr>*:first-child]:text-md
                [&>*>tr>*:first-child]:font-bold
                w-full border-collapse border border-gray-300 dark:border-gray-700">
                <thead class="">
                    <tr class="bg-gray-200 dark:bg-gray-800 text-gray-900 dark:text-white shadow-md">
                        <th class="px-3 py-2 border-x border border-gray-300 dark:border-gray-700">Day</th>
                    </tr>
                </thead>
                <tbody class="">
                    <tr class="bg-white dark:bg-gray-900 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-white"></tr>
                </tbody>
            </table>
        </div>
    </span>

    <script src="https://src.kmu.pisc.cc/script.min.js"></script>

    <script>
        function make_cell(elem, text, options = {}) {
            const cell = document.createElement(elem);
            cell.classList.add("px-3", "py-2", "border-x", "border", "border-gray-300", "dark:border-gray-700");
            cell.innerHTML = text;
            cell.colSpan = options.colspan || 1;
            return cell;
        }

        const timetable = document.getElementById('timetable');
        timetable.innerHTML = '';

        const thead = document.createElement('thead');
        const thead_tr = document.createElement('tr');
        thead_tr.classList.add("bg-gray-200", "dark:bg-gray-800", "text-gray-900", "dark:text-white", "shadow-md")
        thead_tr.appendChild(make_cell('th', 'Day'));
        for (let i = 0; i < 10; i++) {
            thead_tr.appendChild(make_cell('th', `${i + 8}:00 - ${i + 9}:00`));
        }
        thead.appendChild(thead_tr);
        timetable.appendChild(thead);
        
        getLatestScheduleUrl(window.location.pathname.split('/')[2]).then(url => {
            $.getJSON(url, function(alldata) {
            
                console.log(alldata);
                const data = alldata['timetable'];
                console.log(data);
                const tbody = document.createElement('tbody');
                
                
                const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
                for (let i = 0; i < days.length; i++) {
                    const tr = document.createElement('tr');
                    tr.classList.add("bg-white", "dark:bg-gray-900", "hover:bg-gray-100", "dark:hover:bg-gray-800", "text-gray-800", "dark:text-white");
                    tr.appendChild(make_cell('td', days[i]));
                    
                    let j = 8;
                    for (let k = 0; k < data[days[i].toLowerCase()].length; k++) {
    
                        while (j < data[days[i].toLowerCase()][k]['from']) {
                            tr.appendChild(make_cell('td', ''));
                            j++;
                        }
                        const td = make_cell('td', `<b>${data[days[i].toLowerCase()][k]['name-en']}</b><br>${data[days[i].toLowerCase()][k]['name-th']}<br><span class="text-lg md:text-base">${data[days[i].toLowerCase()][k]['room']}</span><br><b>${data[days[i].toLowerCase()][k]['code']} (${data[days[i].toLowerCase()][k]['section']})</b><br>${data[days[i].toLowerCase()][k]['instructor'].map(instructor => instructor['name-th']).join('<br>')}`, {colspan: data[days[i].toLowerCase()][k]['to'] - data[days[i].toLowerCase()][k]['from']});
                        tr.appendChild(td);
                        // j = data[days[i].toLowerCase()][k]['to'];
                        j += data[days[i].toLowerCase()][k]['to'] - data[days[i].toLowerCase()][k]['from'];
                    }
                    for (let l = 0; l < 10 - j + 8; l++) {
                        tr.appendChild(make_cell('td', ''));
                    }
                    tbody.appendChild(tr);
                }
                timetable.appendChild(tbody);
    
                if (alldata['exam']) {
                    // Exam Schedule
                    // const exam_data = alldata['exam'];
                    // console.log(exam_data);
                    // const exam = document.getElementById('exam');
                    // exam.innerHTML = '';
                    // const tbody_exam = document.createElement('tbody');
                    // // for (let i = 0; i < exam_data['ignore'].length; i++) {
                    // //     const tr = document.createElement('tr');
                    // //     tr.classList.add("bg-white", "dark:bg-gray-900", "hover:bg-gray-100", "dark:hover:bg-gray-800", "text-gray-800", "dark:text-white");
                    // //     tr.appendChild(make_cell('td', `<b>${exam_data['ignore'][i]['name-en']}</b><br>${exam_data['ignore'][i]['name-th']}`, {colspan: 2}));
                    // //     tbody_exam.appendChild(tr);
                    // // }
                    // const exam_days = Object.keys(exam_data);
                    // let exam_times = [];
                    // for (let i = 0; i < exam_days.length; i++) {
                    //     const times = exam_data[exam_days[i]].map(time => [time['from'], time['to']]).flat();
                    //     // const unique_times = [...new Set(times)];
                    //     exam_times.push(...times);
                    // }
                    // // make it uniue
                    // // const unique_times = [...new Set(exam_times)];
                    // // console.log(unique_times);
                    // exam_times = [...new Set(exam_times)];
                    // // sort it
                    // exam_times.sort((a, b) => a - b);
                    // console.log(exam_times)
                    // // const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
                    // // console.log(exam_data)
                    // for (let i = 0; i < days.length; i++) {
                    //     const tr = document.createElement('tr');
                    //     tr.classList.add("bg-white", "dark:bg-gray-900", "hover:bg-gray-100", "dark:hover:bg-gray-800", "text-gray-800", "dark:text-white");
                    //     tr.appendChild(make_cell('td', days[i]));
                    //     j = 8;
                    //     for (let k = 0; k < exam_times.length; k++) {
                            
                    //     }
                    //     const td = make_cell('td', `<b>${exam_data[exam_days[i]]['name-en']}<br>${exam_data[exam_days[i]]['name-th']}</b><br>${exam_data[exam_days[i]]['room']}`, {colspan: 2});
                    //     tr.appendChild(td);
                    //     tbody_exam.appendChild(tr);
                    // }
                    // exam.appendChild(tbody_exam);
                    
                    // ================= EXAM SCHEDULE =================
                    const exam_data = alldata['exam'];
                    const exam = document.getElementById('exam');
                    exam.innerHTML = '';
    
                    // ---- exam days come directly from JSON keys ----
                    const exam_days = Object.keys(exam_data).filter(k => k !== 'ignore');
    
                    // ---- collect exam times ----
                    let exam_times = [];
                    exam_days.forEach(day => {
                        exam_data[day].forEach(e => {
                            exam_times.push(Number(e.from), Number(e.to));
                        });
                    });
    
                    // ---- unique + sort ----
                    exam_times = [...new Set(exam_times)].sort((a, b) => a - b);
    
                    // ---- derive contiguous slots (old layout compatible) ----
                    const EXAM_SLOTS = [];
                    for (let i = 0; i < exam_times.length - 1; i++) {
                        EXAM_SLOTS.push({
                            from: exam_times[i],
                            to: exam_times[i + 1]
                        });
                    }
    
                    // ---------- THEAD ----------
                    const examthead = document.createElement('thead');
                    const headTr = document.createElement('tr');
                    headTr.classList.add(
                        "bg-gray-200",
                        "dark:bg-gray-800",
                        "text-gray-900",
                        "dark:text-white",
                        "shadow-md"
                    );
    
                    headTr.appendChild(make_cell('th', 'Day'));
    
                    EXAM_SLOTS.forEach(s => {
                        headTr.appendChild(
                            make_cell('th', `${s.from}:00 - ${s.to}:00`)
                        );
                    });
    
                    examthead.appendChild(headTr);
                    exam.appendChild(examthead);
    
                    // ---------- TBODY ----------
                    const examtbody = document.createElement('tbody');
    
                    exam_days.forEach(dayLabel => {
                        const exams = exam_data[dayLabel];
    
                        const tr = document.createElement('tr');
                        tr.classList.add(
                            "bg-white",
                            "dark:bg-gray-900",
                            "hover:bg-gray-100",
                            "dark:hover:bg-gray-800",
                            "text-gray-800",
                            "dark:text-white"
                        );
    
                        // Row header uses FULL JSON KEY
                        tr.appendChild(make_cell('td', dayLabel));
    
                        let slotIndex = 0;
    
                        while (slotIndex < EXAM_SLOTS.length) {
                            const slot = EXAM_SLOTS[slotIndex];
    
                            const examItem = exams.find(e =>
                                Number(e.from) <= slot.from &&
                                Number(e.to) > slot.from
                            );
    
                            if (!examItem) {
                                tr.appendChild(make_cell('td', ''));
                                slotIndex++;
                                continue;
                            }
    
                            // calculate colspan
                            let span = 0;
                            while (
                                slotIndex + span < EXAM_SLOTS.length &&
                                Number(examItem.to) > EXAM_SLOTS[slotIndex + span].from
                            ) {
                                span++;
                            }
    
                            tr.appendChild(
                                make_cell(
                                    'td',
                                    `<b>${examItem['name-en']}</b><br>
                                    ${examItem['name-th']}<br>
                                    ${examItem['room']}`,
                                    { colspan: span }
                                )
                            );
    
                            slotIndex += span;
                        }
    
                        examtbody.appendChild(tr);
                    });
    
                    exam.appendChild(examtbody);
                } else {
                    document.getElementById('exam').classList.add('hidden');
                }
    
            });
        //     })
        //     .catch(error => console.error(error));
        // });
            
        })
    </script>
</body>
</html>
