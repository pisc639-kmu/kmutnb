<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E15 Exam Schedule & Timetable</title>
    <link rel="icon" type="image/png" href="https://kmu.pisc.cc/img/logo-nobg.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://kmu.pisc.cc/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" integrity="sha384-5TcZemv2l/9On385z///+d7MSYlvIEw9FuZTIdZ14vJLqWphw7e7ZPuOiCHJcFCP" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" integrity="sha384-cMkvdD8LoxVzGF/RPUKAcvmm49FQ0oxwDF3BGKtDXcEc+T1b2N+teh/OJfpU0jr6" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh" crossorigin="anonymous" onload="renderMathInElement(document.body);"></script>
</head>
<body class="dark bg-gray-100 dark:bg-gray-900">
    <div class="flex items-center justify-center space-x-4 mt-16">
        <h1 class="text-4xl font-bold mb-4 text-gray-800 dark:text-white">Storage</h1>
    </div>

    <div id="main-container" class="bg-gray-200 dark:bg-gray-800 border border-gray-500 rounded-md ml-1 mr-1 p-1 space-y-1">
        
    </div>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=folder" />
    <script>
        (async () => {
            // https://api.github.com/repos/pisc639-kmu/kmutnb/contents/
            const root = "https://api.github.com/repos/pisc639-kmu/kmutnb/contents/";

            async function getFolders(path) {
                const url = root + path;
                const response = await fetch(url);
                const jsonData = await response.json();
                const filteredData = Object.fromEntries(
                    Object.entries(jsonData).filter(([key, value]) => value.type == "dir")
                );
                console.log(filteredData);
            };

            async function getFiles(path) {
                const url = root + path;
                const response = await fetch(url);
                const jsonData = await response.json();
                const filteredData = Object.fromEntries(
                    Object.entries(jsonData).filter(([key, value]) => value.type == "file")
                );
                console.log(filteredData);
            };

            function createFolderButton(name, parent) {
                const button = document.createElement("button");
                button.classList.add("p-", "bg-gray-100", "dark:bg-gray-900", "border", "border-gray-500", "border-md", "rounded-md", "w-full", "h-12", "text-lg")
                button.textContent = name
                parent.appendChild(button)
            }

            const mainContainer = document.getElementById("main-container")
            createFolderButton("hi", mainContainer)
            createFolderButton("hi", mainContainer)
            createFolderButton("hi", mainContainer)
            createFolderButton("hi", mainContainer)
        })();
    </script>
    <script src="https://kmu.pisc.cc/script.js"></script>
</body>
</html>
