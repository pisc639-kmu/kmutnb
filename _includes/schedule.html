<script>
    async function downloadFileFromURL(url, filename) {
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const blob = await response.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = filename || url.split('/').pop();
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(blobUrl), 100);

        } catch (error) {
            console.error('Download failed:', error);
            alert('Could not download the file. Check console for details.' + error);
        }
    }

    function isDarkMode() {
        if (window.matchMedia) {
            return window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        return false;
    };

    async function getLatestScheduleUrl(classId) {
        const apiUrl = `https://con.kmu.pisc.cc/schedule/${classId}/`;

        try {
            // 1. Fetch the data from the API
            const response = await fetch(apiUrl);
            if (!response.ok) {
                throw new Error(`Network response was not ok: ${response.status}`);
            }
            const files = await response.json();

            // 2. Filter files matching your exact regex pattern
            const regex = /^[123]-[12]-[mf]\.json$/;
            const filteredFiles = files.filter(file => regex.test(file.name));

            if (filteredFiles.length === 0) {
                throw new Error("No matching schedule files found.");
            }

            // 3. Sort to find the latest file chronologically
            filteredFiles.sort((a, b) => {
                const [yearA, semA, typeA] = a.name.replace('.json', '').split('-');
                const [yearB, semB, typeB] = b.name.replace('.json', '').split('-');

                // Compare Year first
                if (yearA !== yearB) return parseInt(yearA) - parseInt(yearB);

                // Compare Semester second
                if (semA !== semB) return parseInt(semA) - parseInt(semB);

                // Compare Exam Type (Assuming 'm' = Midterm, 'f' = Final)
                // This ensures Final ('f') is treated as later than Midterm ('m')
                const typeWeight = { 'm': 1, 'f': 2 };
                return typeWeight[typeA] - typeWeight[typeB];
            });

            // 4. Get the last element (the latest file)
            const latestFile = filteredFiles[filteredFiles.length - 1];

            // 5. Construct and return the target URL
            return `https://src.kmu.pisc.cc/schedule/${classId}/${latestFile.name}`;

        } catch (error) {
            console.error("Error processing schedule:", error);
            return null;
        }
    }

    /**
     * Captures a high-quality PNG screenshot of any DOM element and downloads it.
     * @param {string} selector - The CSS selector of the node (e.g., '#header', '.profile-card').
     * @param {string} [filename=screenshot.png] - Optional custom name for the downloaded file.
     */
    async function captureNode(selector, filename = 'table.png') {
        const element = document.querySelector(selector);

        if (!element) {
            console.error(`Element not found for selector: "${selector}"`);
            return;
        }

        // 1. Inject html2canvas dynamically if it is not already loaded
        if (typeof html2canvas === 'undefined') {
            console.log('Loading high-quality screenshot engine...');
            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cloudflare.com';
                script.onload = resolve;
                script.onerror = () => reject(new Error('Failed to load screenshot library.'));
                document.head.appendChild(script);
            });
        }

        console.log('Generating crisp 3x resolution image...');
        try {
            // 2. Render the DOM element onto a high-density canvas
            const canvas = await html2canvas(element, {
                scale: 3,             // 3x multiplier removes blurriness and sharpens text
                useCORS: true,        // Allows external images/fonts to render
                logging: false,
                backgroundColor: null // Keeps original element background behavior
            });

            // 3. Convert canvas to PNG and trigger browser download
            const imageURI = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = filename.endsWith('.png') ? filename : `${filename}.png`;
            link.href = imageURI;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            console.log(`Successfully downloaded: ${link.download}`);
        } catch (error) {
            console.error('Screenshot generation failed:', error);
        }
    }

</script>
