<script>
    async function downloadFileFromURL(url, filename) {
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const blob = await response.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = filename || url.split('/').pop();
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(blobUrl), 100);

        } catch (error) {
            console.error('Download failed:', error);
            alert('Could not download the file. Check console for details.' + error);
        }
    }

    function isDarkMode() {
        if (window.matchMedia) {
            return window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        return false;
    };

    function getTableUrl() {
        var Url = location.href;
        Url += 'table.png'
        const newBase = "https://src.kmu.pisc.cc/";
        Url = Url.replace(/^https?:\/\/[^\/]+/, newBase);
        return Url
    }

    function download_image() {
        var download_url = getTableUrl();

        var a = document.createElement('a');
        a.href = download_url;
        a.download = download_url;

        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    };


    async function getLatestScheduleUrl(classId) {
        const apiUrl = `https://con.kmu.pisc.cc/schedule/${classId}/`;

        try {
            // 1. Fetch the data from the API
            const response = await fetch(apiUrl);
            if (!response.ok) {
                throw new Error(`Network response was not ok: ${response.status}`);
            }
            const files = await response.json();

            // 2. Filter files matching your exact regex pattern
            const regex = /^[123]-[12]-[mf]\.json$/;
            const filteredFiles = files.filter(file => regex.test(file.name));

            if (filteredFiles.length === 0) {
                throw new Error("No matching schedule files found.");
            }

            // 3. Sort to find the latest file chronologically
            filteredFiles.sort((a, b) => {
                const [yearA, semA, typeA] = a.name.replace('.json', '').split('-');
                const [yearB, semB, typeB] = b.name.replace('.json', '').split('-');

                // Compare Year first
                if (yearA !== yearB) return parseInt(yearA) - parseInt(yearB);

                // Compare Semester second
                if (semA !== semB) return parseInt(semA) - parseInt(semB);

                // Compare Exam Type (Assuming 'm' = Midterm, 'f' = Final)
                // This ensures Final ('f') is treated as later than Midterm ('m')
                const typeWeight = { 'm': 1, 'f': 2 };
                return typeWeight[typeA] - typeWeight[typeB];
            });

            // 4. Get the last element (the latest file)
            const latestFile = filteredFiles[filteredFiles.length - 1];

            // 5. Construct and return the target URL
            return `https://src.kmu.pisc.cc/schedule/${classId}/${latestFile.name}`;

        } catch (error) {
            console.error("Error processing schedule:", error);
            return null;
        }
    };

    async function screenshot() {
        (async () => {
            // 1. Dynamically load html2canvas if it isn't already on the page
            if (!window.html2canvas) {
                console.log('Loading html2canvas library...');
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
                console.log('Library loaded successfully.');
            }
    
            // 2. TARGET YOUR ELEMENT HERE (e.g., '.classname', 'div.header', '#id')
            const element = document.querySelector('#timetable');
    
            if (!element) {
                console.error('Element not found! Make sure your selector is correct.');
                return;
            }
    
            try {
                console.log('Generating high-res screenshot...');
    
                // 3. Render the element to a canvas
                const canvas = await html2canvas(element, {
                    scale: 3,         // 3x device scale for crystal-clear, high-DPI quality
                    useCORS: true,    // Allows loading external images safely
                    logging: false
                });
    
                // 4. Convert canvas to a link and auto-click to download
                const downloadLink = document.createElement('a');
                downloadLink.href = canvas.toDataURL('image/png');
                downloadLink.download = 'table.png';
                downloadLink.click();
    
                console.log('Screenshot downloaded successfully!');
            } catch (error) {
                console.error('Screenshot failed:', error);
            }
        })();
    };

</script>
