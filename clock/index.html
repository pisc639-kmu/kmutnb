<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E25 - Clock</title>
    {% include "head.html" %}
</head>
<body class="dark bg-gray-100 dark:bg-black overflow-y-hidden">
    {% include "nav.html" %}
    <div id="screen" class="h-[calc(100vh-5rem)] flex flex-col items-center justify-center">
        <!-- <div class="fixed inset-0 -z-10 bg-[url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSRAQQ7ZjyZ5KNgxHPBBYi9WgCgBfJlS7KgFw9whV7-2EVHYJnOKFiUfhW6&s=10')] bg-cover bg-center bg-no-repeat invert dark:invert-0"></div>
        <div class="fixed inset-0 -z-10 backdrop-blur-3xl backdrop-brightness-[0.5] bg-black/10"></div> -->
        {% include "background.html" %}
        <span class="scale-[45%] md:scale-[80%] lg:scale-[100%] flex flex-col items-center justify-center">
            <div id="main" class="mt-16 flex relative space-0 justify-center">
            </div>
            <h1 id="time-text" class="text-6xl font-bold text-black dark:text-white mt-10 lg:mb-4 lg:mt-16"></h1>
            <div id="time" class="mt-0 flex relative justify-center" style="scale: 0.5;">
        </span>
    </div>

    <div class="flex justify-center space-x-4 md:space-x-8 mt-4">
        <a id="night" href="night" class="bg-gradient-to-br from-blue-600 to-indigo-600 dark:from-blue-950 dark:to-indigo-900 hover:from-blue-700 hover:to-indigo-700 dark:hover:from-blue-900 dark:hover:to-indigo-800 text-white font-medium py-2 px-4 rounded-md border border-blue-500 duration-300 shadow-md shadow-blue-600/25 hover:shadow-lg hover:shadow-blue-700/40 dark:hover:shadow-blue-900/50 active:scale-[0.98] transition-all duration-200 hover:shadow-blue-500 text-center">Night Mode</a>
    </div>

    <style>
        #time-text {
            font-family: "Fredoka", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
            font-variation-settings:
                "wdth" 100;
        }

        .clock {
            width: 2rem;
            height: 2rem;
            /* background: oklch(20% 0 0); */
            /* border: 0.125rem solid oklch(30% 0 0); */
            position: relative;
            border-radius: 50%;
        }

        .hand {
            height: 0.1875rem;
            /* height: 0.09375rem; */
            /* background: oklch(0.9475 0.1916 119.15);  */
            /* background: oklch(100% 0 0);  */
            position: absolute;
            top: 50%;
            
            border-radius: 20px;
            corner-shape: bevel;
        
            left: 40%;
            width: 50%;
            translate: 20% -50%;
            transform-origin: 0% 50%;

            opacity: 1;
            transition: rotate 0.5s linear, opacity 250ms ease-in-out;
            rotate: 45deg;
        }

        .hand:nth-child(1) {
            z-index: 1;
        }

        .hand:nth-child(2) {
            z-index: 2;
        }
    </style>
    <script>
        const opacity = (element, digit) => {element.style.opacity = digit === " " ? 0.2 : 1};
        function createSeperatorElement(parent) {
            const seperator = document.createElement('div');
            seperator.classList.add('seperator', 'grid', 'grid-cols-1', 'w-[2rem]');
            for (let i = 0; i < 6; i++){
                const clock = document.createElement('div');
                clock.classList.add('clock', 'bg-white/50', 'dark:bg-[oklch(20%_0_0)]', 'border-[0.125rem]', 'border-solid', 'border-[oklch(80%_0_0)]', 'dark:border-[oklch(30%_0_0)]');
                for (let k = 0; k < 2; k++) {
                    const hand = document.createElement('div');
                    hand.classList.add('hand', 'bg-black', 'dark:bg-white');
                    hand.style.rotate = k == 0 ? 45 : 45 + 'deg';
                    opacity(hand, " ");
                    // hand.style.opacity = 0.2;
                    clock.appendChild(hand);
                }
                seperator.appendChild(clock);
            }
            parent.appendChild(seperator);
        }
        function createDigitElement(parent) {
            const digit = document.createElement('div');
            digit.classList.add('digit', 'grid', 'grid-cols-4', 'w-[8rem]');
            for (let i = 0; i < 24; i++) {
                const clock = document.createElement('div');
                clock.classList.add('clock', 'bg-white/50', 'dark:bg-[oklch(20%_0_0)]', 'border-[0.125rem]', 'border-solid', 'border-[oklch(80%_0_0)]', 'dark:border-[oklch(30%_0_0)]');
                for (let k = 0; k < 2; k++) {
                    const hand = document.createElement('div');
                    hand.classList.add('hand', 'bg-black', 'dark:bg-white');
                    hand.style.rotate = '45deg';
                    opacity(hand, " ");
                    clock.appendChild(hand);
                }
                digit.appendChild(clock);
            }
            parent.appendChild(digit);
        }
        function createNumberElement(parent, digits) {
            const number = document.createElement('div');
            number.classList.add('number', 'flex', 'relative');
            for (let i = 0; i < digits; i++) {
                createDigitElement(number);
            }
            parent.appendChild(number);
        }
        for (let i = 0; i < 3; i++) {
            createNumberElement(document.getElementById('main'), 2);
            if (i < 2) {
                createSeperatorElement(document.getElementById('main'));
            }
        }

        const angles = {
            "┌": [0, 90],
            "┐": [90, 180],
            "┘": [180, 270],
            "└": [270, 360],
            "-": [0, 180],
            "|": [90, 270],
            " ": [135, 315],
            "a": [90, 90],
            "b": [270, 270],
            "c": [45, 180],
            "d": [90, 225],
            "e": [45, 270],
            "f": [0, 225],
            "g": [0, 135],
            "h": [270, 135],
            "i": [90, 45],
            "j": [90, 135],
            "k": [90, 315],
            "l": [270, 315],
            "m": [270, 225],
            "n": [315, 180],
            "o": [90, 215],
        };

        const digits = {
            "0": `
┌--┐
|┌┐|
||||
||||
|└┘|
└--┘
            `,

            "1": `

            `,

            "2": `

┌-┘|
|┌-┘
|└-┐
└--┘
            `,

            "3": `

 ┌┘|
 └┐|
┌-┘|
└--┘
            `,

            "4": `

||||

            `,

            "5": `

            `,

            "7": `

            `,

            "8": `

            `,

            "9": `

            `,

            "S": `

└-┐|
┌-┘|
└--┘
            `,

            "U": `
┌┐┌┐
||||
||||
||||
|└┘|
└--┘
            `,

            "N": `
┌c┌┐
| d|
|a||
||b|
|e |
└┘f┘
            `,

            "M": `
┌┐┌┐
|eh|
|ij|
||||
||||
└┘└┘
            `,

            "O": `

            "R": `

            "F": `

            "I": `

            "A": `
 gc

            `,

            "!": `

efgh
ijkl
mno 
    
    
            `,
        };
        Object.keys(digits).forEach(key => digits[key] = digits[key].replace(/[\r\n]+/gm, '').slice(0, 24).split(''));

        function setDigit(element, digit) {
            for (let [cellIndex, cell] of Array.from(element.children).entries()) {
                const hands = cell.children;
                [0, 1].forEach(i => {
                    if (hands[i].style.transition !== angles[digits[digit][cellIndex]][i]) {
                        // hands[i].style.transition = `rotate 0.1s ease-in, opacity 250ms ease-in-out`;
                        hands[i].style.transition = `rotate ${Math.abs(Number(hands[i].style.rotate.slice(0, -3)) - angles[digits[digit][cellIndex]][i]) / 360 / 0.3 * (0.2 + Math.random() * 0.1)}s ease-in, opacity 250ms ease-in-out`;
                        
                        let row = Math.floor(cellIndex / 4);
                        let col = cellIndex % 4;
                        
                        setTimeout(() => {
                            opacity(hands[i], digits[digit][cellIndex]);
                            hands[i].style.rotate = `${angles[digits[digit][cellIndex]][i]}deg`;
                        // }, (cellIndex + col + row) / digits[digit].length / 4 * 1000);
                        // }, );
                        }, (row + col + (Math.random() - 0.5) * 3) / digits[digit].length * 2 * 1000);
                    };
                })
            }
        }

        function setNumber(element, number) {
            for (let [Index, digit] of Array.from(element.children).entries()) {
                setDigit(digit, String(number).padStart(2, '0').split('')[Index]);
            }
        }
        function initSeparator(separator) {
            for (let [cellIndex, cell] of Array.from(separator.children).entries()) {
                for (let [k, hand] of Array.from(cell.children).entries()) {
                    hand.style.rotate = '45deg';
                    const target = k == 0 ? 135 : 315;
                    hand.style.transition = `rotate ${Math.abs(target - 45) / 360 / 0.3 * (0.2 + Math.random() * 0.1)}s ease-in, opacity 250ms ease-in-out`;
                    setTimeout(() => {
                        hand.style.rotate = target + 'deg';
                    }, cellIndex / separator.children.length / 4 * 1000);
                    opacity(hand, " ");
                }
            }
        }

        const time = document.getElementById('time');
        createNumberElement(time, 3);
        createSeperatorElement(time);
        createNumberElement(time, 2);
        createSeperatorElement(time);
        createNumberElement(time, 2);
        createSeperatorElement(time);
        createNumberElement(time, 4);

        document.querySelectorAll('.seperator').forEach(separator => initSeparator(separator));

        function tick() {
            const main = document.getElementById('main');
            const number = main.querySelectorAll('.number');
            setNumber(number[0], new Date().getHours());
            setNumber(number[1], new Date().getMinutes());
            setNumber(number[2], new Date().getSeconds());

            const timeText = document.getElementById('time-text');
            const Days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const Months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            timeText.textContent = `${Days[new Date().getDay()]}, ${new Date().getDate()} ${Months[new Date().getMonth()]} ${new Date().getFullYear()}`;

            const timeElement = document.getElementById('time');
            setNumber(timeElement.children[0], Days[new Date().getDay()].slice(0, 3).toUpperCase());
            setNumber(timeElement.children[2], new Date().getDate());
            setNumber(timeElement.children[4], new Date().getMonth());
            setNumber(timeElement.children[6], new Date().getFullYear());
        }
        
        const now = () => Date.now()/1000|0;
        const startTime = now();
        tick()
        const IntervalId = setInterval(() => {
            if (now() - startTime >= 1) {
                console.log('Ticking...');
                clearInterval(IntervalId);
                tick();
                // setTimeout(() => setInterval(tick, 100), 1);
                setTimeout(() => setInterval(tick, 1000), 1);
            }
        }, 1);
        document.getElementById('screen').addEventListener('click', () => {
            const main = document.getElementById('screen');
            const night = document.getElementById('night');
            if (document.fullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                };
                // night.classList.remove('display-none');
                // document.body.style.cursor = 'default';
            } else {
                if (main.requestFullscreen) {
                    main.requestFullscreen();
                } else if (main.webkitRequestFullscreen) {
                    main.webkitRequestFullscreen();
                } else if (main.mozRequestFullScreen) {
                    main.mozRequestFullScreen();
                } else if (main.msRequestFullscreen) {
                    main.msRequestFullscreen();
                }
                // night.classList.add('display-none');
                // document.body.style.cursor = 'none';
            }
        });
        document.addEventListener('fullscreenchange', () => {
            // If document.fullscreenElement is null, the user has exited full screen
            if (!document.fullscreenElement) {
                console.log('Exited full screen mode.');
                // Run your exit-specific logic here
                night.classList.remove('display-none');
                document.body.style.cursor = 'default';
            } else {
                console.log('Entered full screen mode.');
                night.classList.add('display-none');
                document.body.style.cursor = 'none';
            }
        });

    </script>

</html>
