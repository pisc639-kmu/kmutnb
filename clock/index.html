        .clock {
            width: 2rem;
            height: 2rem;
            background: oklch(20% 0 0);
            border: 0.125rem solid oklch(30% 0 0);
            position: relative;
        }

        .hand {
            height: 0.1875rem;
            /* height: 0.09375rem; */
            background: oklch(0.9475 0.1916 119.15); 
            position: absolute;
            top: 50%;
            left: 50%;
            translate: 0% -50%;
            width: 50%;
            transform-origin: center left;
            opacity: 1;
            /* transition: opacity 250ms ease-in-out; */
            transition: rotate 0.5s linear, opacity 250ms ease-in-out;
            rotate: 45deg;
        }

        .hand:nth-child(1) {
            z-index: 1;
        }

        .hand:nth-child(2) {
            z-index: 2;
        }

    <script>
        function createDigitElement(parent) {
            const digit = document.createElement('div');
            // digit.classList.add('digit');
            // for (let i = 0; i < 5; i++) {
            //     const row = document.createElement('div');
            //     row.classList.add('row', 'flex');
            //     for (let j = 0; j < 3; j++) {
            //         const clock = document.createElement('div');
            //         clock.classList.add('clock');
            //         for (let k = 0; k < 2; k++) {
            //             const hand = document.createElement('div');
            //             hand.classList.add('hand');
            //             clock.appendChild(hand);
            //         }
            //         row.appendChild(clock);
            //     }
            //     digit.appendChild(row);
            // }
            digit.classList.add('digit', 'grid', 'grid-cols-4', 'w-[8rem]');
            for (let i = 0; i < 24; i++) {
                const clock = document.createElement('div');
                clock.classList.add('clock');
                for (let k = 0; k < 2; k++) {
                    const hand = document.createElement('div');
                    hand.classList.add('hand');
                    hand.style.rotate = '45deg';
                    clock.appendChild(hand);
                }
                digit.appendChild(clock);
            }
            parent.appendChild(digit);
        }
        function createNumberElement(parent, digits) {
            const number = document.createElement('div');
            number.classList.add('number', 'flex', 'relative');
            for (let i = 0; i < digits; i++) {
                createDigitElement(number);
            }
            parent.appendChild(number);
        }
        for (let i = 0; i < 3; i++) {
            createNumberElement(document.getElementById('main'), 2);
        }

        const angles = {
            "┌": [0, 90],
            "┐": [90, 180],
            "┘": [180, 270],

            " ": [135, 315],
            "a": [90, 90],
            "b": [270, 270],
            "c": [45, 180],
            "d": [90, 225],
            "e": [45, 270],
            "f": [0, 225],
            "g": [0, 135],
            "h": [270, 135],
            "i": [90, 45],
            "j": [90, 135],
            "k": [90, 315],
            "l": [270, 315],
            "m": [270, 225],

        // digits = digits.map(digit => digit.slice(1,25));
        Object.keys(digits).forEach(key => digits[key] = digits[key].replace(/[\r\n]+/gm, '').slice(0, 24).split(''));

        function setDigit(element, digit) {
            for (let [cellIndex, cell] of Array.from(element.children).entries()) {
                const hands = cell.children;
                if (hands[0].style.transition !== angles[digits[digit][cellIndex]][0]) {
                    hands[0].style.transition = `rotate ${Math.abs(Number(hands[0].style.rotate.slice(0, -3)) - angles[digits[digit][cellIndex]][0]) / 360 / 3}s linear, opacity 250ms ease-in-out`;
                };
                if (hands[1].style.transition !== angles[digits[digit][cellIndex]][1]) {
                    hands[1].style.transition = `rotate ${Math.abs(Number(hands[1].style.rotate.slice(0, -3)) - angles[digits[digit][cellIndex]][1]) / 360 / 3}s linear, opacity 250ms ease-in-out`;
                };
                hands[0].style.rotate = `${angles[digits[digit][cellIndex]][0]}deg`;
                hands[1].style.rotate = `${angles[digits[digit][cellIndex]][1]}deg`;
                hands[0].style.opacity = `${digits[digit][cellIndex] === " " ? 0.3 : 1}`;
                hands[1].style.opacity = `${digits[digit][cellIndex] === " " ? 0.3 : 1}`;
            }
        }

        function setNumber(element, number) {
            for (let [Index, digit] of Array.from(element.children).entries()) {
                setDigit(digit, String(number).padStart(2, '0').split('')[Index]);
            }
        }

        function tick() {
            const main = document.getElementById('main');
            // for (const number of main.children) {
            //     setNumber(number, Math.floor(Math.random() * 100));
            // }
            setNumber(main.children[0], new Date().getHours());
            setNumber(main.children[1], new Date().getMinutes());
            setNumber(main.children[2], new Date().getSeconds());
            // for (let [cellIndex, cell] of Array.from(digit.children).entries()) {
            //     const hands = cell.children;
            //     hands[0].style.rotate = `${angles[digits[3][cellIndex]][0]}deg`;
            //     hands[1].style.rotate = `${angles[digits[3][cellIndex]][1]}deg`;
            // }
            const timeText = document.getElementById('time-text');
            // timeText.textContent = new Date().toLocaleTimeString();
            const Days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const Months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            timeText.textContent = `${Days[new Date().getDay()]}, ${new Date().getDate()} ${Months[new Date().getMonth()]} ${new Date().getFullYear()}`;

            const timeElement = document.getElementById('time');
            setNumber(timeElement.children[0], Days[new Date().getDay()].slice(0, 3).toUpperCase());
            setNumber(timeElement.children[1], new Date().getDate());
            setNumber(timeElement.children[2], new Date().getMonth());
            setNumber(timeElement.children[3], new Date().getFullYear());
        }
        
        tick()
        setInterval(() => {
            tick()
        }, 100);

        document.getElementById('screen').addEventListener('click', () => {
            const main = document.getElementById('screen');
            // main.requestFullscreen();
            if (document.fullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) { /* Firefox */
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) { /* IE11 */
                    document.msExitFullscreen();
                }
            } else {
                if (main.requestFullscreen) {
                    main.requestFullscreen();
                } else if (main.webkitRequestFullscreen) { /* Safari */
                    main.webkitRequestFullscreen();
                } else if (main.mozRequestFullScreen) { /* Firefox */
                    main.mozRequestFullScreen();
                } else if (main.msRequestFullscreen) { /* IE11 */
                    main.msRequestFullscreen();
                }
            }
        });
